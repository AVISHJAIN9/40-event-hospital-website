<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Hover Effect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        
        <div class="card">
            <div class="card-image-container">
                <img src="https://via.placeholder.com/400x300?text=Image+1" alt="Mountain Landscape">
            </div>
            <div class="card-content">
                <h3>Card Title 1</h3>
                <p>Hover over this card to see the image zoom. This effect is pure CSS.</p>
            </div>
        </div>

        <div class="card">
            <div class="card-image-container">
                <img src="https://via.placeholder.com/400x300?text=Image+2" alt="Cityscape">
            </div>
            <div class="card-content">
                <h3>Card Title 2</h3>
                <p>The card's 'overflow: hidden' property is key to this effect.</p>
            </div>
        </div>

        <div class="card">
            <div class="card-image-container">
                <img src="https://via.placeholder.com/400x300?text=Image+3" alt="Ocean View">
            </div>
            <div class="card-content">
                <h3>Card Title 3</h3>
                <p>We use the :hover pseudo-class to trigger a CSS transform.</p>
            </div>
        </div>

        <div class="card">
            <div class="card-image-container">
                <img src="https://via.placeholder.com/400x300?text=Image+4" alt="Forest Path">
            </div>
            <div class="card-content">
                <h3>Card Title 4</h3>
                <p>A transition on the image makes the zoom smooth.</p>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
