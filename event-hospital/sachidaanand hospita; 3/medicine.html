<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sachidaanand Health - Packages</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        /* --- 1. UNIFIED BRAND COLORS --- */
        :root {
            --brand-blue: #036af9;       
            --brand-cyan: #06b6d4;       
            --brand-dark: #0f172a;       
            --text-muted: #475569;
            --bg-light: #eef2f3;
            
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            
            --color-success: #10b981;
            --color-danger: #ef4444;
            --color-warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            scroll-behavior: smooth;
        }

        /* --- 2. ANIMATED BACKGROUND GRID --- */
        body {
            background-color: var(--bg-light);
            color: var(--brand-dark);
            min-height: 100vh;
            overflow-x: hidden;
            /* Subtle moving grid to match main page */
            background-image: 
                linear-gradient(rgba(3, 106, 249, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(3, 106, 249, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: moveBackground 30s linear infinite;
        }

        @keyframes moveBackground {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        /* --- 3. HERO SECTION WITH VIDEO --- */
        .hero-section {
            position: relative;
            width: 100%;
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        }

        .video-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
            /* Filter to match blue theme */
            filter: brightness(1.1) hue-rotate(10deg) saturate(0.8); 
        }

        .hero-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(239, 246, 255, 0.85), rgba(219, 234, 254, 0.6));
            backdrop-filter: blur(2px);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 800px;
            padding: 0 20px;
            animation: fadeInUp 1s ease forwards;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 15px;
            background: -webkit-linear-gradient(45deg, var(--brand-dark), var(--brand-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }

        .hero-content h3 {
            font-size: 1.2rem;
            color: var(--text-muted);
            font-weight: 400;
            margin-bottom: 30px;
        }

        .scroll-down-btn {
            background: linear-gradient(135deg, var(--brand-blue), var(--brand-cyan));
            color: white;
            padding: 12px 35px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(3, 106, 249, 0.3);
            transition: all 0.3s ease;
        }

        .scroll-down-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(3, 106, 249, 0.4);
        }

        /* --- 4. MAIN CONTENT & CONTROLS --- */
        .main-content-container {
            max-width: 1300px;
            margin: -50px auto 50px; /* Overlap hero slightly */
            position: relative;
            z-index: 3;
            padding: 0 20px;
        }

        /* Glass Control Bar */
        .controls-wrapper {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 25px;
            border-radius: 20px;
            box-shadow: var(--glass-shadow);
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .search-container { width: 100%; max-width: 600px; position: relative; }
        
        #searchInput {
            width: 100%;
            padding: 15px 20px 15px 50px;
            border: 1px solid rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.5);
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        #searchInput:focus {
            background: white;
            box-shadow: 0 5px 15px rgba(3, 106, 249, 0.15);
            border-color: var(--brand-blue);
        }
        .search-icon {
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
            color: var(--brand-blue);
        }

        .category-filters {
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
        }

        .category-filter-btn {
            background: white;
            border: 1px solid transparent;
            padding: 8px 20px;
            border-radius: 30px;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .category-filter-btn:hover, .category-filter-btn.active {
            background: var(--brand-blue);
            color: white;
            box-shadow: 0 5px 15px rgba(3, 106, 249, 0.3);
            transform: translateY(-2px);
        }

        /* --- 5. PRODUCTS GRID (3D TILT CARDS) --- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: var(--glass-bg);
            border: 1px solid white;
            border-radius: 20px;
            padding: 30px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s;
            transform-style: preserve-3d; /* For Tilt */
            transform: perspective(1000px);
            /* Entrance Animation */
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
        }

        .product-card:hover {
            box-shadow: 0 20px 40px rgba(3, 106, 249, 0.15);
        }

        .card-header { margin-bottom: 15px; }
        
        .card-header h3 {
            font-size: 1.4rem;
            color: var(--brand-dark);
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .card-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--brand-blue);
            font-weight: 700;
            background: rgba(3, 106, 249, 0.1);
            padding: 5px 10px;
            border-radius: 10px;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .card-price {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--brand-blue);
        }

        /* Buttons */
        .btn-group { display: flex; gap: 10px; }

        .action-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
        }

        .btn-details {
            background: white; color: var(--brand-blue);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .btn-details:hover { background: var(--bg-light); transform: scale(1.1); }

        .btn-add {
            background: var(--brand-blue); color: white;
            box-shadow: 0 5px 15px rgba(3, 106, 249, 0.3);
        }
        .btn-add:hover { background: var(--brand-cyan); transform: scale(1.1); }

        /* --- 6. CART SIDEBAR (Glassmorphism) --- */
        .cart-sidebar {
            position: fixed; top: 0; right: 0; width: 100%; max-width: 420px; height: 100%;
            background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
            z-index: 1000; box-shadow: -10px 0 30px rgba(0,0,0,0.1);
            transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1);
            display: flex; flex-direction: column;
        }
        .cart-sidebar.open { transform: translateX(0); }

        .sidebar-header {
            padding: 25px;
            background: rgba(3, 106, 249, 0.05);
            display: flex; justify-content: space-between; align-items: center;
        }

        .close-btn {
            background: none; border: none; font-size: 1.5rem; cursor: pointer;
            color: var(--text-muted); transition: 0.3s;
        }
        .close-btn:hover { color: var(--color-danger); transform: rotate(90deg); }

        .cart-items-list { flex-grow: 1; overflow-y: auto; padding: 25px; }

        .cart-item {
            background: white; padding: 15px; border-radius: 15px;
            margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            display: flex; justify-content: space-between; align-items: center;
            animation: slideIn 0.3s ease;
        }

        .quantity-control {
            display: flex; align-items: center; background: var(--bg-light);
            border-radius: 10px; padding: 2px;
        }
        .quantity-control button {
            width: 25px; height: 25px; border: none; background: white;
            border-radius: 8px; cursor: pointer; font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .quantity-control span { margin: 0 10px; font-size: 0.9rem; font-weight: 600; }

        .remove-btn { color: var(--text-muted); border: none; background: none; cursor: pointer; margin-left: 10px; }
        .remove-btn:hover { color: var(--color-danger); }

        .cart-summary-footer {
            padding: 30px; border-top: 1px solid rgba(0,0,0,0.05); background: white;
        }
        .checkout-btn {
            width: 100%; padding: 15px; background: var(--brand-blue); color: white;
            border: none; border-radius: 50px; font-weight: 700; font-size: 1.1rem;
            cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(3, 106, 249, 0.2);
        }
        .checkout-btn:hover { background: var(--brand-cyan); transform: translateY(-3px); }

        /* Floating Icon */
        .floating-cart-icon {
            position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px;
            background: var(--brand-blue); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
            box-shadow: 0 10px 25px rgba(3, 106, 249, 0.4); cursor: pointer; z-index: 900;
            transition: transform 0.3s;
        }
        .floating-cart-icon:hover { transform: scale(1.1) rotate(10deg); }
        .cart-count-badge {
            position: absolute; top: 0; right: 0; background: var(--color-danger);
            color: white; font-size: 0.75rem; width: 24px; height: 24px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            border: 2px solid white;
        }

        /* Animations */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

        /* Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(5px);
            z-index: 2000; display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .modal-overlay.open { opacity: 1; visibility: visible; }
        
        .product-details-modal {
            background: white; width: 90%; max-width: 600px; border-radius: 25px;
            padding: 40px; position: relative; transform: scale(0.9); transition: 0.3s;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
        }
        .modal-overlay.open .product-details-modal { transform: scale(1); }
        
        .modal-close-btn {
            position: absolute; top: 20px; right: 20px; border: none; background: none;
            font-size: 1.5rem; cursor: pointer; color: var(--text-muted);
        }
        
        /* Checkout Message */
        .checkout-message {
            padding: 15px; margin: 15px 20px 0; border-radius: 10px; color: white;
            font-weight: 600; text-align: center; display: none; font-size: 0.9rem;
        }
        .checkout-message.success { background: var(--color-success); }
        .checkout-message.error { background: var(--color-danger); }

    </style>
</head>
<body>
    
    <div class="hero-section">
        <video class="video-bg" autoplay muted loop playsinline>
            <source src="https://player.vimeo.com/external/452134136.sd.mp4?s=7284986687c73631780845570c04804b00f8f723&profile_id=164&oauth2_token_id=57447761" type="video/mp4">
        </video>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1>Health Checkup <br>& Diagnostics</h1>
            <h3>Comprehensive screenings for early detection and better well-being.</h3>
            <button id="scrollToPackages" class="scroll-down-btn">
                View Packages <i class="fas fa-arrow-down" style="margin-left: 8px;"></i>
            </button>
        </div>
    </div>

    <div class="main-content-container" id="mainContent">
        
        <div class="controls-wrapper">
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" placeholder="Search for tests (e.g. 'Heart', 'Diabetes')...">
            </div>
            <div id="categoryFilters" class="category-filters">
                </div>
        </div>

        <div id="products" class="product-grid">
            </div>
    </div>

    <div class="floating-cart-icon" onclick="toggleCartSidebar()">
        <i class="fas fa-shopping-bag"></i>
        <span id="cartCountBadge" class="cart-count-badge">0</span>
    </div>

    <div class="cart-sidebar" id="cartSidebar">
        <div class="sidebar-header">
            <h2>Your Cart</h2>
            <button class="close-btn" onclick="toggleCartSidebar()"><i class="fas fa-times"></i></button>
        </div>
        <div id="checkoutMessage" class="checkout-message"></div>
        <div id="cartItems" class="cart-items-list"></div>
        <div class="cart-summary-footer">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-size:1.2rem;">
                <span>Total:</span>
                <span id="cartTotal" style="color:var(--brand-blue); font-weight:800;">$0.00</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Secure Checkout <i class="fas fa-lock" style="font-size:0.8em; margin-left:5px;"></i></button>
        </div>
    </div>
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCartSidebar()"></div>

    <div class="modal-overlay" id="productModalOverlay" onclick="if(event.target.id === 'productModalOverlay') closeProductDetails()">
        <div class="product-details-modal" id="productDetailsModal"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>

    <script>
        // --- DATA ---
        const products = [
            { id: 1, type: 'package', name: "Basic Wellness Check", category: "General", front_desc: "Essential annual screening of key vitals.", price: 99.99, tests: ["Blood Glucose", "CBC", "Liver Function", "Kidney Function"] },
            { id: 2, type: 'package', name: "Advanced Cardiac", category: "Heart", front_desc: "Detailed assessment focused on heart.", price: 199.50, tests: ["ECG", "Echo Doppler", "hs-CRP", "Cholesterol Panel"] },
            { id: 3, type: 'package', name: "Vitamin D & B12", category: "Vitamins", front_desc: "Crucial for bone health and energy.", price: 75.00, tests: ["25-OH Vitamin D", "Vitamin B12", "Serum Calcium"] },
            { id: 4, type: 'package', name: "Full Body Screening", category: "General", front_desc: "Comprehensive check for all major organs.", price: 349.00, tests: ["Thyroid Profile", "Iron Studies", "Urine Routine", "70+ Parameters"] },
            { id: 5, type: 'package', name: "Diabetic Care", category: "Metabolic", front_desc: "Manage diabetes markers effectively.", price: 125.99, tests: ["HbA1c", "Fasting Glucose", "C-Peptide"] },
            { id: 6, type: 'addon', name: "Thyroid (TSH)", category: "Vitamins", front_desc: "Single test for thyroid hormone.", price: 35.00, tests: ["TSH"] },
            { id: 7, type: 'addon', name: "Prostate (PSA)", category: "Men's Health", front_desc: "Screening test for prostate health.", price: 60.00, tests: ["PSA"] }
        ];

        let cart = []; 
        const allCategories = ["All", ...new Set(products.map(p => p.category))];
        let currentCategoryFilter = 'All';

        // --- CORE FUNCTIONS ---
        function renderProducts(filteredProducts = products) {
            const container = document.getElementById('products');
            container.innerHTML = ''; 

            if (filteredProducts.length === 0) {
                container.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#888;">No items found.</p>';
                return;
            }

            filteredProducts.forEach((product, index) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                // Add Tilt Attributes via JS
                card.setAttribute('data-tilt', '');
                card.setAttribute('data-tilt-max', '5');
                card.setAttribute('data-tilt-speed', '400');
                card.setAttribute('data-tilt-glare', '');
                card.setAttribute('data-tilt-max-glare', '0.2');
                
                // Staggered Animation Delay
                card.style.animationDelay = `${index * 0.1}s`;

                const btnHtml = product.type === 'package' 
                    ? `<button class="action-btn btn-details" onclick="showProductDetails(${product.id})" title="Details"><i class="fas fa-eye"></i></button>
                       <button class="action-btn btn-add" onclick="addToCart(${product.id})" title="Add"><i class="fas fa-plus"></i></button>`
                    : `<button class="action-btn btn-add" onclick="addToCart(${product.id})" style="width:100%; border-radius:30px;">Add to Cart</button>`;

                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span class="card-category">${product.category}</span>
                            <h3 style="margin-top:10px;">${product.name}</h3>
                        </div>
                        <p class="card-desc">${product.front_desc}</p>
                    </div>
                    <div class="card-footer">
                        <span class="card-price">$${product.price.toFixed(2)}</span>
                        <div class="btn-group">${btnHtml}</div>
                    </div>
                `;
                container.appendChild(card);
            });
            
            // Re-init Tilt after adding elements
            VanillaTilt.init(document.querySelectorAll(".product-card"));
        }

        // --- CART LOGIC ---
        function loadCart() {
            const stored = localStorage.getItem('healthCart');
            if (stored) cart = JSON.parse(stored);
        }
        function saveCart() { localStorage.setItem('healthCart', JSON.stringify(cart)); }

        function updateCartDisplay() {
            const list = document.getElementById('cartItems');
            const count = document.getElementById('cartCountBadge');
            const total = document.getElementById('cartTotal');
            
            list.innerHTML = '';
            let sum = 0;
            let items = 0;

            if(cart.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#999;">Cart is empty.</p>';
            }

            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                sum += itemTotal;
                items += item.quantity;
                
                list.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <h4 style="margin:0 0 5px 0; color:var(--brand-dark);">${item.name}</h4>
                            <div style="font-size:0.9em; color:#666;">$${item.price} x ${item.quantity}</div>
                        </div>
                        <div style="display:flex; align-items:center;">
                            <div class="quantity-control">
                                <button onclick="updateQty(${item.id}, -1)">-</button>
                                <span>${item.quantity}</span>
                                <button onclick="updateQty(${item.id}, 1)">+</button>
                            </div>
                            <button class="remove-btn" onclick="removeFromCart(${item.id})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });

            count.innerText = items;
            total.innerText = '$' + sum.toFixed(2);
            saveCart();
        }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            const existing = cart.find(i => i.id === id);
            if(existing) existing.quantity++;
            else cart.push({...prod, quantity: 1});
            updateCartDisplay();
            toggleCartSidebar(true); // Open cart on add
        }

        function updateQty(id, change) {
            const item = cart.find(i => i.id === id);
            if(item) {
                item.quantity += change;
                if(item.quantity <= 0) removeFromCart(id);
                else updateCartDisplay();
            }
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            updateCartDisplay();
        }

        function toggleCartSidebar(open) {
            const sb = document.getElementById('cartSidebar');
            const ov = document.getElementById('cartOverlay');
            if(typeof open === 'boolean') {
                open ? sb.classList.add('open') : sb.classList.remove('open');
                open ? ov.classList.add('active') : ov.classList.remove('active');
            } else {
                sb.classList.toggle('open');
                ov.classList.toggle('active');
            }
        }

        function checkout() {
            const msg = document.getElementById('checkoutMessage');
            if(cart.length === 0) {
                msg.className = 'checkout-message error';
                msg.innerText = "Cart is empty!";
                msg.style.display = 'block';
            } else {
                msg.className = 'checkout-message success';
                msg.innerText = "Order Placed Successfully!";
                msg.style.display = 'block';
                cart = [];
                setTimeout(() => { updateCartDisplay(); toggleCartSidebar(false); msg.style.display='none'; }, 2000);
            }
        }

        // --- FILTERING & MODALS ---
        function renderCategoryFilters() {
            const div = document.getElementById('categoryFilters');
            allCategories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `category-filter-btn ${cat === 'All' ? 'active' : ''}`;
                btn.innerText = cat;
                btn.onclick = () => {
                    document.querySelectorAll('.category-filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategoryFilter = cat;
                    filterProducts();
                };
                div.appendChild(btn);
            });
        }

        function filterProducts() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => {
                const matchCat = currentCategoryFilter === 'All' || p.category === currentCategoryFilter;
                const matchSearch = p.name.toLowerCase().includes(term);
                return matchCat && matchSearch;
            });
            renderProducts(filtered);
        }

        function showProductDetails(id) {
            const p = products.find(i => i.id === id);
            const modal = document.getElementById('productDetailsModal');
            const overlay = document.getElementById('productModalOverlay');
            
            modal.innerHTML = `
                <button class="modal-close-btn" onclick="closeProductDetails()"><i class="fas fa-times"></i></button>
                <h2 style="color:var(--brand-blue); margin-bottom:10px;">${p.name}</h2>
                <p style="font-size:1.1rem; color:#666; margin-bottom:20px;">${p.front_desc}</p>
                <div style="background:var(--bg-light); padding:20px; border-radius:15px; margin-bottom:20px;">
                    <h4 style="margin-bottom:10px;">Tests Included:</h4>
                    <ul style="padding-left:20px;">${p.tests.map(t => `<li>${t}</li>`).join('')}</ul>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:1.8rem; font-weight:bold; color:var(--brand-blue);">$${p.price}</span>
                    <button class="checkout-btn" style="width:auto; padding:10px 30px;" onclick="addToCart(${p.id}); closeProductDetails()">Add to Cart</button>
                </div>
            `;
            overlay.classList.add('open');
        }
        function closeProductDetails() { document.getElementById('productModalOverlay').classList.remove('open'); }

        // --- INITIALIZE ---
        window.onload = () => {
            loadCart();
            renderCategoryFilters();
            renderProducts();
            updateCartDisplay();
            
            document.getElementById('searchInput').addEventListener('input', filterProducts);
            document.getElementById('scrollToPackages').addEventListener('click', () => {
                document.getElementById('mainContent').scrollIntoView({behavior:'smooth'});
            });
        };
    </script>
</body>
</html>
