<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Admission - Sachidaanand Health</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="ADMINFORM.css">
     <script src="ADMINFORM.js"></script>

    <style>
        /* --- 1. VARIABLES --- */
        :root {
            --brand-blue: #036af9;
            --brand-cyan: #06b6d4;
            --brand-dark: #0f172a;
            --text-muted: #475569;
            
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            
            --success-color: #10b981;
            --error-color: #ef4444;
            --info-color: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        /* --- 2. BACKGROUND --- */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--brand-dark);
            overflow-x: hidden;
            position: relative;
        }

        .video-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
            filter: brightness(0.5) hue-rotate(200deg) saturate(1.2); 
        }

        .video-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(3, 106, 249, 0.1), rgba(6, 182, 212, 0.1));
            backdrop-filter: blur(5px);
            z-index: 1;
        }

        /* --- 3. FORM CONTAINER (Glassmorphism) --- */
        .form-container {
            position: relative;
            z-index: 10;
            width: 95%;
            max-width: 900px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 40px;
            box-shadow: var(--glass-shadow);
            animation: fadeInUp 0.8s ease forwards;
            margin: 50px 0;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--brand-dark);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        h1 i { color: var(--brand-blue); }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(3, 106, 249, 0.1);
            padding-bottom: 15px;
        }

        /* Fieldsets */
        fieldset {
            border: none;
            padding: 0;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.5);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.6);
        }

        legend {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--brand-blue);
            padding: 0 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Form Grid */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        
        .required { color: var(--error-color); }

        /* Inputs */
        input, select, textarea {
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 1rem;
            background: white;
            transition: all 0.3s;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--brand-blue);
            box-shadow: 0 0 10px rgba(3, 106, 249, 0.2);
        }

        /* Button */
        button[type="submit"] {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--brand-blue), var(--brand-cyan));
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 25px rgba(3, 106, 249, 0.3);
        }

        button[type="submit"]:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(3, 106, 249, 0.4);
        }

        .info-text {
            text-align: center;
            margin-top: 15px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        
        #userIdDisplay { font-weight: 700; color: var(--brand-blue); }

        /* --- 4. CUSTOM MODAL --- */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; top: 0; width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.6); 
            backdrop-filter: blur(5px);
            align-items: center; justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            position: relative;
            animation: scaleIn 0.3s ease;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }

        .close-button {
            position: absolute; top: 15px; right: 20px; font-size: 2rem; cursor: pointer; color: #aaa;
        }
        .close-button:hover { color: var(--brand-dark); }

        #modalTitle { font-size: 1.8rem; font-weight: 800; margin: 15px 0 10px; color: var(--brand-dark); }
        #modalMessage { color: var(--text-muted); margin-bottom: 25px; font-size: 1.1rem; }
        
        .modal-close-btn {
            background: var(--brand-dark); color: white; border: none; padding: 10px 30px;
            border-radius: 30px; cursor: pointer; font-weight: 600; transition: 0.3s;
        }
        .modal-close-btn:hover { background: var(--brand-blue); }

        /* Animations */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Responsive */
        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; gap: 0; }
            .form-container { padding: 20px; width: 95%; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <video class="video-bg" autoplay muted loop playsinline>
        <source src="https://player.vimeo.com/external/371835760.sd.mp4?s=d7a7c17343583749289132c00007359136664375&profile_id=164&oauth2_token_id=57447761" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <div class="form-container">
        <h1><i class="fas fa-user-injured"></i> Patient Admission</h1>
        <p class="subtitle">Securely record patient details for hospital admission.</p>
        
        <form id="admissionForm">
            <fieldset>
                <legend><i class="fas fa-id-card"></i> Patient Demographics</legend>
                <div class="form-group">
                    <label for="patientName">Full Name <span class="required">*</span></label>
                    <input type="text" id="patientName" name="patientName" placeholder="e.g., John Doe" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="dob">Date of Birth <span class="required">*</span></label>
                        <input type="date" id="dob" name="dob" required>
                    </div>
                    <div class="form-group">
                        <label for="gender">Gender <span class="required">*</span></label>
                        <select id="gender" name="gender" required>
                            <option value="" disabled selected>Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="phone">Contact Phone <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" placeholder="e.g., 123-456-7890" required>
                </div>
                <div class="form-group">
                    <label for="address">Residential Address</label>
                    <textarea id="address" name="address" rows="2" placeholder="Full address..."></textarea>
                </div>
            </fieldset>

            <fieldset>
                <legend><i class="fas fa-hospital-alt"></i> Admission Details</legend>
                <div class="form-row">
                    <div class="form-group">
                        <label for="admissionDate">Date of Admission <span class="required">*</span></label>
                        <input type="date" id="admissionDate" name="admissionDate" required>
                    </div>
                    <div class="form-group">
                        <label for="department">Department <span class="required">*</span></label>
                        <select id="department" name="department" required>
                            <option value="" disabled selected>Select Department</option>
                            <option value="Cardiology">Cardiology</option>
                            <option value="Neurology">Neurology</option>
                            <option value="Orthopaedics">Orthopaedics</option>
                            <option value="General Medicine">General Medicine</option>
                            <option value="Emergency">Emergency</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="reason">Reason for Admission <span class="required">*</span></label>
                    <textarea id="reason" name="reason" rows="3" placeholder="Symptoms, diagnosis, or referral notes..."></textarea>
                </div>
            </fieldset>

            <fieldset>
                <legend><i class="fas fa-phone-alt"></i> Emergency Contact</legend>
                <div class="form-group">
                    <label for="ecName">Name <span class="required">*</span></label>
                    <input type="text" id="ecName" name="ecName" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="ecRelation">Relationship</label>
                        <input type="text" id="ecRelation" name="ecRelation" placeholder="e.g., Spouse, Parent">
                    </div>
                    <div class="form-group">
                        <label for="ecPhone">Phone <span class="required">*</span></label>
                        <input type="tel" id="ecPhone" name="ecPhone" required>
                    </div>
                </div>
            </fieldset>

            <button type="submit" id="submitBtn">
                <i class="fas fa-check-circle"></i> Submit Admission Record
            </button>
            
            <p class="info-text">
                <i class="fas fa-user-lock"></i> Admitting User ID: <span id="userIdDisplay">Connecting...</span>
            </p>
        </form>
    </div>

    <div id="statusModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeModal()">&times;</span>
            <div id="modalIcon"></div>
            <h3 id="modalTitle">Title</h3>
            <p id="modalMessage">Message goes here.</p>
            <button class="modal-close-btn" onclick="closeModal()">Close</button>
        </div>
    </div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, addDoc, collection, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let db;
        let auth;
        let userId = '';

        setLogLevel('Debug'); 

        async function initializeFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        document.getElementById('userIdDisplay').textContent = userId;
                    } else {
                        userId = crypto.randomUUID();
                        document.getElementById('userIdDisplay').textContent = 'ANON-' + userId.substring(0, 8) + '...';
                    }
                    document.getElementById('admissionForm').addEventListener('submit', handleFormSubmit);
                });

            } catch (error) {
                console.error("Firebase Initialization or Auth Error:", error);
                showModal('Connection Error', 'Failed to connect to the database.', 'error');
            }
        }

        window.showModal = (title, message, type) => {
            const modal = document.getElementById('statusModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalIcon = document.getElementById('modalIcon');

            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modalIcon.innerHTML = ''; 

            let iconClass = '';
            let iconColor = '';
            
            if (type === 'success') {
                iconClass = 'fas fa-check-circle'; iconColor = 'var(--success-color)';
            } else if (type === 'error') {
                iconClass = 'fas fa-times-circle'; iconColor = 'var(--error-color)';
            } else {
                iconClass = 'fas fa-info-circle'; iconColor = 'var(--info-color)';
            }

            modalIcon.innerHTML = `<i class="${iconClass}" style="color: ${iconColor}; font-size: 50px; margin-bottom:10px;"></i>`;
            modal.style.display = 'flex'; // Flex to center
        };

        window.closeModal = () => {
            document.getElementById('statusModal').style.display = 'none';
        };
        
        async function handleFormSubmit(event) {
            event.preventDefault();
            
            if (!userId) {
                showModal('Wait', 'System is connecting...', 'info');
                return;
            }

            const form = event.target;
            const formData = new FormData(form);
            const admissionData = {};

            for (const [key, value] of formData.entries()) {
                admissionData[key] = value.trim();
            }

            admissionData.admittingUserId = userId;
            admissionData.timestamp = new Date().toISOString();
            admissionData.status = 'Admitted';

            try {
                const collectionPath = `/artifacts/${appId}/public/data/admissions`;
                const docRef = await addDoc(collection(db, collectionPath), admissionData);

                showModal(
                    'Admission Successful', 
                    `Patient ${admissionData.patientName} has been admitted. \nRecord ID: ${docRef.id}`, 
                    'success'
                );

                form.reset(); 

            } catch (e) {
                console.error("Error adding document: ", e);
                showModal('Submission Failed', 'Could not save record. Please check internet connection.', 'error');
            }
        }
        
        initializeFirebase();
    </script>
</body>
</html>
