<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Health Packages & Cart</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* --- SHARED VARIABLES --- */
        :root {
            --color-bg-1: #eff6ff;
            --color-bg-2: #dbeafe;
            --color-bg-3: #bfdbfe;
            --color-text-main: #0f172a; 
            --color-text-muted: #475569;
            --color-accent-blue: #2563eb;
            --color-accent-cyan: #06b6d4;
            --color-emergency: #ef4444;
            --color-green: #10b981;
            
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: linear-gradient(-45deg, var(--color-bg-1), var(--color-bg-2), var(--color-bg-3), #ffffff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--color-text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- NAVIGATION --- */
        nav {
            width: 90%;
            max-width: 600px;
            height: 60px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            z-index: 100;
            position: relative;
        }

        nav a {
            flex: 1;
            text-align: center;
            font-size: 0.9em;
            font-weight: 600;
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.3s;
        }
        nav a:hover, nav a.active { color: #fff; }

        /* --- HERO SECTION --- */
        .hero-container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            box-shadow: var(--glass-shadow);
        }

        .hero-text h1 {
            font-size: 3em;
            font-weight: 800;
            margin-bottom: 15px;
            line-height: 1.1;
            background: -webkit-linear-gradient(45deg, var(--color-text-main), var(--color-accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-text h3 {
            font-weight: 400;
            color: var(--color-text-muted);
            font-size: 1.1em;
            margin-bottom: 30px;
            max-width: 500px;
        }

        .hero-image img {
            width: 350px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            cursor: pointer;
            transform-style: preserve-3d;
            transform: perspective(1000px);
        }

        .scroll-down-btn {
            padding: 12px 25px;
            background: var(--color-accent-blue);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3);
        }
        .scroll-down-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
        }

        /* --- MAIN CONTENT & SEARCH --- */
        .main-content-container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto 100px;
        }

        .search-container {
            margin-bottom: 40px;
            position: relative;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-container input {
            width: 100%;
            padding: 18px 25px 18px 55px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.5);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            font-size: 1rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            transition: all 0.3s;
            outline: none;
        }

        .search-container input:focus {
            border-color: var(--color-accent-blue);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.15);
        }

        .search-container::before {
            content: '\f002';
            font-family: "Font Awesome 5 Free";
            font-weight: 900;
            position: absolute;
            left: 25px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-accent-blue);
            font-size: 1.1rem;
            z-index: 10;
        }

        /* --- FLIP CARD STYLES (Height Adjusted for Addons) --- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 30px;
        }

        .package-card {
            background-color: transparent;
            height: 480px; /* Increased height for Addons */
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .package-card:hover .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.8);
            overflow: hidden;
        }

        /* FRONT SIDE */
        .card-front {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            z-index: 2;
        }

        .card-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--color-bg-1), var(--color-bg-2));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-accent-blue);
            font-size: 2.5rem;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.15);
        }

        .card-front h3 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: var(--color-text-main);
        }

        .front-price {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--color-accent-blue);
            margin-top: 10px;
        }

        .flip-hint {
            margin-top: auto;
            font-size: 0.8rem;
            color: var(--color-text-muted);
            opacity: 0.7;
            background: rgba(37, 99, 235, 0.1);
            padding: 5px 15px;
            border-radius: 20px;
        }

        /* BACK SIDE (WITH ADDONS) */
        .card-back {
            background: linear-gradient(135deg, #ffffff, var(--color-bg-1));
            transform: rotateY(180deg);
            align-items: flex-start; 
            text-align: left;
            padding: 25px;
        }

        .card-back h3 {
            font-size: 1.1rem;
            color: var(--color-accent-blue);
            margin-bottom: 10px;
            width: 100%;
            text-align: center;
            border-bottom: 2px solid rgba(37, 99, 235, 0.1);
            padding-bottom: 8px;
        }

        /* Scrollable Tests List */
        .feature-list {
            list-style: none;
            width: 100%;
            font-size: 0.85rem;
            color: var(--color-text-muted);
            margin-bottom: 15px;
            max-height: 100px;
            overflow-y: auto;
        }

        .feature-list::-webkit-scrollbar { width: 4px; }
        .feature-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        .feature-list li {
            margin-bottom: 6px;
            display: flex;
            align-items: center;
        }

        .feature-list li i {
            color: var(--color-green);
            margin-right: 8px;
            font-size: 0.8rem;
        }

        /* ADDONS SECTION STYLING */
        .addons-container {
            width: 100%;
            background: rgba(37, 99, 235, 0.05);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px dashed rgba(37, 99, 235, 0.3);
        }

        .addons-header {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--color-text-main);
        }

        .addon-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--color-text-muted);
            cursor: pointer;
        }

        .addon-item input {
            margin-right: 8px;
            accent-color: var(--color-accent-blue);
            cursor: pointer;
        }

        .card-back .add-btn {
            width: 100%;
            margin-top: auto;
        }

        .add-btn {
            background: var(--color-accent-blue);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3);
        }

        .add-btn:hover {
            background: var(--color-accent-cyan);
            transform: scale(1.02);
        }

        /* --- CART UI & CROSS ANIMATION --- */
        .floating-cart-icon {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: var(--color-accent-blue); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4); cursor: pointer; z-index: 999;
            transition: transform 0.3s;
        }
        .floating-cart-icon:hover { transform: scale(1.1); }

        .cart-count-badge {
            position: absolute; top: -5px; right: -5px; background: var(--color-emergency);
            color: white; font-size: 0.75rem; font-weight: bold; width: 24px; height: 24px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            border: 2px solid white;
        }

        .cart-sidebar {
            position: fixed; top: 0; right: 0; width: 100%; max-width: 400px; height: 100vh;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); z-index: 1000;
            transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1);
            box-shadow: -10px 0 30px rgba(0,0,0,0.1); display: flex; flex-direction: column;
        }
        .cart-sidebar.open { transform: translateX(0); }

        .sidebar-header {
            padding: 25px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .close-btn {
            background: transparent; border: none; font-size: 1.5rem; color: var(--color-text-muted);
            cursor: pointer; transition: all 0.4s ease; width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center; border-radius: 50%;
        }
        .close-btn:hover {
            color: var(--color-emergency); background: rgba(239, 68, 68, 0.1);
            transform: rotate(180deg) scale(1.1);
        }

        .cart-items-list { flex-grow: 1; overflow-y: auto; padding: 20px; }

        .cart-item {
            display: flex; align-items: flex-start; padding: 15px; background: white;
            border-radius: 15px; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            animation: slideIn 0.3s ease; transition: all 0.3s ease;
        }
        .cart-item.removing { transform: translateX(-100%); opacity: 0; }

        @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .cart-item-info { flex-grow: 1; margin-left: 15px; }
        .cart-item-title { font-weight: 600; font-size: 0.95rem; display: block; margin-bottom: 4px; }
        .cart-item-addons { font-size: 0.8rem; color: var(--color-text-muted); display: block; margin-bottom: 4px; }
        .cart-item-price { color: var(--color-accent-blue); font-size: 0.9rem; font-weight: 700; }

        .remove-item-btn {
            color: var(--color-text-muted); background: transparent; border: none; cursor: pointer;
            padding: 8px; border-radius: 50%; transition: all 0.3s; margin-top: 5px;
        }
        .remove-item-btn:hover { 
            color: var(--color-emergency); background: rgba(239, 68, 68, 0.1); transform: rotate(90deg);
        }

        .cart-summary-footer { padding: 30px; border-top: 1px solid rgba(0,0,0,0.05); }
        .total-cost { font-size: 1.2rem; font-weight: 800; margin: 10px 0 20px 0; display: flex; justify-content: space-between; }
        .cart-summary-footer button {
            width: 100%; padding: 15px; background: var(--color-text-main); color: white; border: none;
            border-radius: 12px; font-weight: 700; cursor: pointer; transition: background 0.3s;
        }
        .cart-summary-footer button:hover { background: var(--color-accent-blue); }

        .cart-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(3px);
            z-index: 999; opacity: 0; visibility: hidden; transition: all 0.3s;
        }
        .cart-overlay.active { opacity: 1; visibility: visible; }

        @media (max-width: 768px) {
            .hero-container { flex-direction: column; text-align: center; }
            .hero-image img { width: 100%; max-width: 300px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="main.html">Home</a> 
        <a href="#" class="active">Packages</a>
        <a href="docter.html">Doctors</a>
        <a href="emergency.html">Contact</a>
    </nav>

    <div class="hero-container">
        <div class="hero-text">
            <h1>Health Checkup <br>& Diagnostics</h1>
            <h3>Comprehensive screenings for early detection. Advanced labs powered by AI precision.</h3>
            <button id="scrollToPackages" class="scroll-down-btn" onclick="document.getElementById('mainContent').scrollIntoView()">
                <i class="fas fa-chevron-down"></i> View Packages
            </button>
        </div>
        <div class="hero-image">
            <img id="heroImage" 
                 src="https://images.unsplash.com/photo-1579154204601-01588f351e67?ixlib=rb-4.0.3&auto=format&fit=crop&w=700&q=80" 
                 alt="Health Checkup Image"
                 data-tilt data-tilt-max="15" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.2">
        </div>
    </div>

    <div class="main-content-container" id="mainContent">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search for Full Body, Thyroid, Diabetes...">
        </div>
        <div id="products" class="product-grid"></div>
    </div>

    <div class="floating-cart-icon" onclick="toggleCartSidebar()">
        <i class="fas fa-shopping-basket"></i>
        <span id="cartCountBadge" class="cart-count-badge">0</span>
    </div>

    <div class="cart-sidebar" id="cartSidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-shopping-cart"></i> Your Cart</h2>
            <button class="close-btn" onclick="toggleCartSidebar()"><i class="fas fa-times"></i></button>
        </div>
        <div id="cartItems" class="cart-items-list"></div>
        <div class="cart-summary-footer">
            <p style="color: var(--color-text-muted); margin-bottom:5px;">Total Items: <span id="cartCount">0</span></p>
            <p class="total-cost">Grand Total: <span id="cartTotal">$0.00</span></p>
            <button onclick="checkout()">Proceed to Checkout</button>
        </div>
    </div>
    
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCartSidebar()"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    
    <script>
        // --- 1. DATA (With Addons) ---
        const packages = [
            { 
                id: 1, 
                name: "Basic Wellness Check", 
                category: "General", 
                price: 49.00, 
                icon: "fa-user-md", 
                desc: "Essential checks for daily health monitoring.",
                features: ["CBC (Complete Blood Count)", "Fasting Blood Sugar", "Blood Pressure Check", "BMI Calculation"],
                addons: [
                    { name: "Vitamin D", price: 15 },
                    { name: "Iron Profile", price: 12 }
                ]
            },
            { 
                id: 2, 
                name: "Full Body Comprehensive", 
                category: "Full Body", 
                price: 120.00, 
                icon: "fa-heartbeat", 
                desc: "Top to toe analysis for complete peace of mind.",
                features: ["Kidney Function Test", "Liver Function Test", "Lipid Profile", "ECG & Chest X-Ray", "Vitamin D & B12"],
                addons: [
                    { name: "PSA (Prostate)", price: 20 },
                    { name: "Thyroid Panel", price: 25 }
                ]
            },
            { 
                id: 3, 
                name: "Thyroid Profile Advanced", 
                category: "Thyroid", 
                price: 35.00, 
                icon: "fa-dna", 
                desc: "Detailed analysis of thyroid hormones.",
                features: ["T3 (Triiodothyronine)", "T4 (Thyroxine)", "TSH (Ultrasensitive)", "Free T3 & T4"],
                addons: [
                    { name: "Antibody Test", price: 30 },
                    { name: "Consultation", price: 40 }
                ]
            },
            { 
                id: 4, 
                name: "Diabetes Screening", 
                category: "Diabetes", 
                price: 25.00, 
                icon: "fa-tint", 
                desc: "Keep your sugar levels in check.",
                features: ["HbA1c (3 Month Avg)", "Fasting Glucose", "Post-Prandial Glucose", "Urine Ketones"],
                addons: [
                    { name: "Insulin Fasting", price: 18 },
                    { name: "Diet Chart", price: 10 }
                ]
            },
            { 
                id: 5, 
                name: "Cardiac Health Plus", 
                category: "Heart", 
                price: 85.00, 
                icon: "fa-heart", 
                desc: "Deep dive into heart performance.",
                features: ["Lipid Profile Extended", "ECG / EKG", "hs-CRP", "Cardiologist Consult"],
                addons: [
                    { name: "Echo Color Doppler", price: 60 },
                    { name: "Stress Test", price: 45 }
                ]
            },
            { 
                id: 6, 
                name: "Vitamin Deficiency Test", 
                category: "Vitamins", 
                price: 55.00, 
                icon: "fa-capsules", 
                desc: "Check for vital nutrient deficiencies.",
                features: ["Vitamin D Total", "Vitamin B12", "Iron Studies", "Calcium & Magnesium"],
                addons: [
                    { name: "Folic Acid", price: 15 },
                    { name: "Zinc Levels", price: 10 }
                ]
            },
            { 
                id: 7, 
                name: "Senior Citizen Care", 
                category: "Senior", 
                price: 95.00, 
                icon: "fa-blind", 
                desc: "Specialized care for age-related concerns.",
                features: ["Bone Density Markers", "Arthritis Profile", "Electrolytes", "Renal Profile"],
                addons: [
                    { name: "Home Collection", price: 10 },
                    { name: "Hard Copy Reports", price: 5 }
                ]
            },
            { 
                id: 8, 
                name: "Women's Wellness", 
                category: "Women", 
                price: 75.00, 
                icon: "fa-venus", 
                desc: "Hormonal and general health for women.",
                features: ["Thyroid Profile", "Iron Deficiency", "Hormonal Assay", "Calcium"],
                addons: [
                    { name: "Mammogram", price: 50 },
                    { name: "Pap Smear", price: 25 }
                ]
            }
        ];

        let cart = [];

        // --- 2. RENDER PRODUCTS (WITH ADDONS) ---
        const productContainer = document.getElementById('products');

        function renderProducts(data) {
            productContainer.innerHTML = '';
            data.forEach(pkg => {
                const featureListHTML = pkg.features.map(f => 
                    `<li><i class="fas fa-check-circle"></i> ${f}</li>`
                ).join('');

                // --- GENERATE ADDONS HTML ---
                let addonsHTML = '';
                if (pkg.addons && pkg.addons.length > 0) {
                    addonsHTML = `<div class="addons-container">
                        <div class="addons-header">Optional Add-ons:</div>`;
                    
                    pkg.addons.forEach((addon, idx) => {
                        addonsHTML += `
                            <label class="addon-item">
                                <span>
                                    <input type="checkbox" class="addon-checkbox" 
                                           data-price="${addon.price}" 
                                           data-name="${addon.name}"
                                           onchange="updateCardPrice(this, ${pkg.id}, ${pkg.price})"> 
                                    ${addon.name}
                                </span>
                                <span>+$${addon.price}</span>
                            </label>
                        `;
                    });
                    addonsHTML += `</div>`;
                }

                const card = document.createElement('div');
                card.className = 'package-card';
                card.id = `card-${pkg.id}`; // Add ID for easier selection
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">
                            <div class="card-icon"><i class="fas ${pkg.icon}"></i></div>
                            <h3>${pkg.name}</h3>
                            <p style="color:var(--color-text-muted); font-size:0.9rem; text-align:center;">${pkg.desc}</p>
                            <div class="front-price">$${pkg.price.toFixed(2)}</div>
                            <div class="flip-hint"><i class="fas fa-info-circle"></i> View Details</div>
                        </div>
                        
                        <div class="card-back">
                            <h3><i class="fas fa-clipboard-list"></i> Included Tests</h3>
                            <ul class="feature-list">
                                ${featureListHTML}
                            </ul>
                            
                            ${addonsHTML}
                            
                            <button class="add-btn" id="btn-${pkg.id}" onclick="addToCart(${pkg.id}, event)">
                                <i class="fas fa-shopping-cart"></i> Buy Now - $${pkg.price.toFixed(2)}
                            </button>
                        </div>
                    </div>
                `;
                productContainer.appendChild(card);
            });
        }

        renderProducts(packages);

        // --- 3. DYNAMIC PRICE UPDATE FUNCTION ---
        function updateCardPrice(checkbox, pkgId, basePrice) {
            // Find the specific card container
            const card = document.getElementById(`card-${pkgId}`);
            
            // Find all checked boxes within this specific card
            const checkedBoxes = card.querySelectorAll('.addon-checkbox:checked');
            
            // Calculate total addon cost
            let addonTotal = 0;
            checkedBoxes.forEach(box => {
                addonTotal += parseFloat(box.getAttribute('data-price'));
            });

            // Update the button text
            const newTotal = basePrice + addonTotal;
            const btn = document.getElementById(`btn-${pkgId}`);
            btn.innerHTML = `<i class="fas fa-shopping-cart"></i> Buy Now - $${newTotal.toFixed(2)}`;
        }

        // --- 4. CART LOGIC (UPDATED FOR ADDONS) ---
        function addToCart(id, event) {
            if(event) event.stopPropagation();
            
            const pkg = packages.find(p => p.id === id);
            const card = document.getElementById(`card-${id}`);
            
            // Identify selected addons
            const checkedBoxes = card.querySelectorAll('.addon-checkbox:checked');
            let selectedAddons = [];
            let totalItemPrice = pkg.price;

            checkedBoxes.forEach(box => {
                const name = box.getAttribute('data-name');
                const price = parseFloat(box.getAttribute('data-price'));
                selectedAddons.push({ name: name, price: price });
                totalItemPrice += price;
            });

            // Create cart item object
            const cartItem = {
                ...pkg,
                selectedAddons: selectedAddons,
                finalPrice: totalItemPrice
            };

            cart.push(cartItem);
            updateCartUI();
            
            // Visual Feedback
            const btn = document.getElementById(`btn-${id}`);
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> Added';
            btn.style.background = "var(--color-green)";
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.style.background = "";
                // Optional: Uncheck boxes after adding? 
                // checkedBoxes.forEach(box => box.checked = false);
                // updateCardPrice(null, id, pkg.price);
            }, 1000);
        }

        function removeFromCart(index) {
            const cartItemsList = document.getElementById('cartItems');
            const itemToRemove = cartItemsList.children[index];
            itemToRemove.classList.add('removing');
            setTimeout(() => {
                cart.splice(index, 1);
                updateCartUI();
            }, 300);
        }

        function updateCartUI() {
            const cartList = document.getElementById('cartItems');
            const cartCount = document.getElementById('cartCount');
            const cartCountBadge = document.getElementById('cartCountBadge');
            const cartTotal = document.getElementById('cartTotal');

            cartCount.innerText = cart.length;
            cartCountBadge.innerText = cart.length;
            
            // Calculate Grand Total based on finalPrice (base + addons)
            const total = cart.reduce((sum, item) => sum + item.finalPrice, 0);
            cartTotal.innerText = '$' + total.toFixed(2);

            cartList.innerHTML = '';
            if (cart.length === 0) {
                cartList.innerHTML = '<p style="text-align:center; color:var(--color-text-muted); margin-top:20px;">Your cart is empty.</p>';
            } else {
                cart.forEach((item, index) => {
                    // Format addons string for display
                    let addonsText = '';
                    if(item.selectedAddons.length > 0) {
                        addonsText = '+ ' + item.selectedAddons.map(a => a.name).join(', ');
                    }

                    cartList.innerHTML += `
                        <div class="cart-item">
                            <div class="cart-item-info">
                                <span class="cart-item-title">${item.name}</span>
                                ${addonsText ? `<span class="cart-item-addons">${addonsText}</span>` : ''}
                                <span class="cart-item-price">$${item.finalPrice.toFixed(2)}</span>
                            </div>
                            <button class="remove-item-btn" onclick="removeFromCart(${index})">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    `;
                });
            }
        }

        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = packages.filter(pkg => pkg.name.toLowerCase().includes(term) || pkg.category.toLowerCase().includes(term));
            renderProducts(filtered);
        });

        function toggleCartSidebar() {
            const sidebar = document.getElementById('cartSidebar');
            const overlay = document.getElementById('cartOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        function checkout() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
            } else {
                alert("Proceeding to payment gateway...");
            }
        }
    </script>
</body>
</html>
