<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Hospital Bill Estimator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f3f4f6;
            --text: #1f2937;
            --primary: #2563eb;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            width: 1100px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        /* LEFT SIDE: CONTROLS */
        .input-panel {
            flex: 1;
            padding: 40px;
            border-right: 1px solid #e5e7eb;
            background: #f9fafb;
        }

        h2 { margin-top: 0; color: var(--primary); }
        label { display: block; font-weight: 700; margin-top: 20px; margin-bottom: 8px; font-size: 0.9rem; color: #4b5563; }
        
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            transition: 0.3s;
        }
        select:focus { border-color: var(--primary); outline: none; }

        button {
            width: 100%;
            margin-top: 30px;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #1d4ed8; }

        /* RIGHT SIDE: VISUALS */
        .output-panel {
            flex: 1.4;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- DYNAMIC CREDIT CARD CSS --- */
        .credit-card {
            width: 360px;
            height: 220px;
            border-radius: 15px;
            padding: 25px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transition: all 0.5s ease;
            position: relative;
            overflow: hidden;
            margin-bottom: 30px;
        }

        /* Card Variants (Colors) */
        .card-icici {
            background: linear-gradient(135deg, #ea580c, #c2410c); /* Orange */
        }
        .card-sbi {
            background: linear-gradient(135deg, #2563eb, #1e40af); /* Blue */
        }
        .card-hdfc {
            background: linear-gradient(135deg, #0f172a, #334155); /* Dark Navy */
        }
        .card-debit {
            background: linear-gradient(135deg, #6b7280, #4b5563); /* Grey */
        }

        /* Card Details */
        .bank-logo { font-size: 1.5rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; z-index: 2;}
        .chip { width: 50px; height: 35px; background: linear-gradient(45deg, #fcd34d, #d97706); border-radius: 6px; margin-bottom: 10px; }
        .card-number { font-family: 'Courier New', monospace; font-size: 1.4rem; letter-spacing: 3px; z-index: 2; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .expiry { font-size: 0.9rem; text-align: right; margin-right: 10px; }
        
        /* Decoration Circles on Card */
        .card-circle {
            position: absolute;
            border-radius: 50%;
            background: white;
            opacity: 0.1;
        }

        /* --- BILL BREAKDOWN --- */
        .bill-container {
            width: 100%;
            display: none; /* Hidden initially */
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #e5e7eb; color: #4b5563; }
        .row.total { border-bottom: none; font-size: 1.2rem; font-weight: 800; color: #111827; margin-top: 10px; border-top: 2px solid #e5e7eb; padding-top: 15px; }
        
        .discount-row { color: #16a34a; font-weight: bold; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

<div class="container">
    
    <div class="input-panel">
        <h2>🏥 Cost & Discount Estimator</h2>
        <p style="color:#6b7280; font-size:0.9rem;">Calculate estimation and apply payment offers.</p>

        <label>1. Select Procedure</label>
        <select id="procedure">
            <option value="cataract">Cataract Surgery (₹25,000)</option>
            <option value="appendix">Appendectomy (₹45,000)</option>
            <option value="knee">Knee Replacement (₹1,80,000)</option>
            <option value="angio">Angioplasty (₹2,50,000)</option>
        </select>

        <label>2. Insurance Coverage</label>
        <select id="insurance">
            <option value="0">No Insurance</option>
            <option value="100000">Silver Plan (Limit: ₹1 Lakh)</option>
            <option value="300000">Gold Plan (Limit: ₹3 Lakhs)</option>
        </select>

        <label>3. Select Payment Mode (For Discounts)</label>
        <select id="payment" onchange="updateCardVisual()">
            <option value="debit">Standard Debit Card (0% Off)</option>
            <option value="icici">ICICI Credit Card (5% Off)</option>
            <option value="sbi">SBI Credit Card (3% Off)</option>
            <option value="hdfc">HDFC Regalia Card (4% Off)</option>
        </select>

        <button onclick="calculate()">Generate Final Bill</button>
    </div>

    <div class="output-panel">
        
        <div id="cardVisual" class="credit-card card-debit">
            <div class="card-circle" style="width: 150px; height: 150px; top: -50px; right: -50px;"></div>
            <div class="card-circle" style="width: 100px; height: 100px; bottom: -20px; left: -20px;"></div>

            <div class="bank-logo" id="bankName">DEBIT CARD</div>
            <div>
                <div class="chip"></div>
                <div class="card-number">**** **** 8829</div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <span style="font-size: 0.8rem; text-transform: uppercase; opacity: 0.8;">Holder<br>RAHUL VERMA</span>
                <div>
                    <div class="expiry">VALID THRU 12/28</div>
                    <div style="font-weight:bold; font-style:italic; text-align:right;">VISA</div>
                </div>
            </div>
        </div>

        <div id="billResult" class="bill-container">
            <div style="height: 200px; width:100%; margin-bottom: 20px;">
                <canvas id="costChart"></canvas>
            </div>

            <div class="row">
                <span>Estimated Procedure Cost:</span>
                <span id="baseCost">₹0</span>
            </div>
            <div class="row" style="color:#2563eb;">
                <span>Insurance Covers:</span>
                <span id="insCover">- ₹0</span>
            </div>
            <div class="row">
                <span>Net Amount (Before Discount):</span>
                <span id="netBefore">₹0</span>
            </div>
            <div class="row discount-row">
                <span id="discountText">Payment Discount (0%):</span>
                <span id="discountAmt">- ₹0</span>
            </div>
            
            <div class="row total">
                <span>YOU PAY:</span>
                <span id="finalPay">₹0</span>
            </div>
        </div>

    </div>
</div>

<script>
    // 1. DATA OBJECTS
    const costs = {
        cataract: 25000,
        appendix: 45000,
        knee: 180000,
        angio: 250000
    };

    const discounts = {
        debit: { rate: 0, name: "Debit Card", colorClass: "card-debit", logo: "DEBIT CARD" },
        icici: { rate: 0.05, name: "ICICI Credit", colorClass: "card-icici", logo: "ICICI BANK" },
        sbi: { rate: 0.03, name: "SBI Card", colorClass: "card-sbi", logo: "SBI CARD" },
        hdfc: { rate: 0.04, name: "HDFC Regalia", colorClass: "card-hdfc", logo: "HDFC BANK" }
    };

    let chartInstance = null;

    // 2. UPDATE CARD VISUALS (Change Color/Text)
    function updateCardVisual() {
        const payMode = document.getElementById('payment').value;
        const cardData = discounts[payMode];
        const cardDiv = document.getElementById('cardVisual');
        const bankName = document.getElementById('bankName');

        // Remove all old color classes
        cardDiv.classList.remove('card-debit', 'card-icici', 'card-sbi', 'card-hdfc');
        
        // Add new color class
        cardDiv.classList.add(cardData.colorClass);
        
        // Update Text
        bankName.innerText = cardData.logo;
    }

    // 3. CALCULATE BILL
    function calculate() {
        const proc = document.getElementById('procedure').value;
        const insLimit = parseFloat(document.getElementById('insurance').value);
        const payMode = document.getElementById('payment').value;

        // A. Base Cost
        const totalCost = costs[proc];

        // B. Insurance Logic
        // Insurance pays up to the limit, but not more than the total cost
        const insurancePays = Math.min(totalCost, insLimit);
        
        // C. Remainder
        const remainder = totalCost - insurancePays;

        // D. Discount Logic (Applied ONLY on the remainder that user has to pay)
        const discountRate = discounts[payMode].rate;
        const discountAmount = remainder * discountRate;
        const finalAmount = remainder - discountAmount;

        // E. Update UI Text
        document.getElementById('billResult').style.display = 'block';
        document.getElementById('baseCost').innerText = "₹" + totalCost.toLocaleString();
        document.getElementById('insCover').innerText = "- ₹" + insurancePays.toLocaleString();
        document.getElementById('netBefore').innerText = "₹" + remainder.toLocaleString();
        
        document.getElementById('discountText').innerText = `Bank Discount (${discountRate*100}%):`;
        document.getElementById('discountAmt').innerText = "- ₹" + Math.round(discountAmount).toLocaleString();
        
        document.getElementById('finalPay').innerText = "₹" + Math.round(finalAmount).toLocaleString();

        // F. Update Chart
        renderChart(insurancePays, discountAmount, finalAmount);
    }

    function renderChart(ins, disc, pay) {
        const ctx = document.getElementById('costChart').getContext('2d');
        if(chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: ['Insurance Paid', 'Discount Saved', 'You Pay'],
                datasets: [{
                    data: [ins, disc, pay],
                    backgroundColor: ['#3b82f6', '#22c55e', '#1f2937'], // Blue, Green, Dark Grey
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'right' }
                }
            }
        });
    }
</script>

</body>
</html>
