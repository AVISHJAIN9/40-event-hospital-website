<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sachidaanand Health - Testimonials</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        /* --- 1. VARIABLES (Matching Main Site) --- */
        :root {
            --brand-blue: #036af9;
            --brand-cyan: #06b6d4;
            --brand-dark: #0f172a;
            --text-light: #f8fafc;
            
            --glass-bg: rgba(15, 23, 42, 0.75); 
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            
            --status-green: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            height: 100vh;
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--brand-dark);
        }

        /* --- 2. BACKGROUND VIDEO --- */
        .video-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
            filter: brightness(0.6) hue-rotate(190deg) saturate(1.2); 
        }

        .video-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(3, 106, 249, 0.3), rgba(6, 182, 212, 0.1));
            backdrop-filter: blur(8px);
            z-index: 1;
        }

        /* --- 3. MAIN LAYOUT --- */
        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 1200px;
            height: 85vh;
            display: flex;
            gap: 40px;
            align-items: stretch;
        }

        /* --- 4. FORM SECTION (Left Side) --- */
        .form-container {
            flex: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            box-shadow: var(--glass-shadow);
            padding: 40px;
            display: flex;
            flex-direction: column;
            animation: fadeInLeft 1s ease forwards;
            overflow-y: auto;
        }

        .form-container h1 {
            color: white;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }

        /* Image Upload */
        .image-upload-group {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        #image-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--brand-cyan);
            background: rgba(255,255,255,0.1);
        }

        input[type="file"] { display: none; }

        .file-upload-label {
            background: rgba(255,255,255,0.1);
            color: var(--text-light);
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .file-upload-label:hover {
            background: var(--brand-blue);
            border-color: var(--brand-blue);
        }

        /* Input Fields */
        .form-field {
            position: relative;
            margin-bottom: 25px;
        }

        .form-field input, .form-field textarea {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        
        .form-field textarea { resize: none; }

        .form-field label {
            position: absolute;
            left: 15px;
            top: 12px;
            color: rgba(255,255,255,0.5);
            pointer-events: none;
            transition: 0.3s;
            font-size: 1rem;
        }

        /* Floating Label Logic */
        .form-field input:focus, .form-field input:not(:placeholder-shown),
        .form-field textarea:focus, .form-field textarea:not(:placeholder-shown) {
            border-color: var(--brand-cyan);
            background: rgba(0,0,0,0.4);
        }

        .form-field input:focus + label, .form-field input:not(:placeholder-shown) + label,
        .form-field textarea:focus + label, .form-field textarea:not(:placeholder-shown) + label {
            top: -22px;
            left: 0;
            color: var(--brand-cyan);
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Star Rating */
        .star-rating-group { margin-bottom: 25px; }
        .star-rating-group label { 
            color: rgba(255,255,255,0.7); font-size: 0.9rem; display: block; margin-bottom: 8px;
        }
        
        .star-rating-input {
            display: flex;
            flex-direction: row-reverse; /* CSS trick for filling stars */
            justify-content: flex-end;
            gap: 5px;
        }
        .star-rating-input input { display: none; }
        
        .star-rating-input label {
            font-size: 1.5rem;
            color: rgba(255,255,255,0.2);
            cursor: pointer;
            transition: 0.2s;
            margin: 0;
        }

        .star-rating-input label:hover,
        .star-rating-input label:hover ~ label,
        .star-rating-input input:checked ~ label {
            color: #facc15; /* Gold Color */
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--brand-blue), var(--brand-cyan));
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(3, 106, 249, 0.3);
        }
        .submit-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(6, 182, 212, 0.4); }

        #message-area { margin-top: 15px; text-align: center; font-size: 0.9rem; min-height: 20px; }

        /* --- 5. TICKER SECTION (Right Side) --- */
        .testimonial-ticker {
            flex: 1;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 25px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            animation: fadeInRight 1s ease forwards;
            position: relative;
            overflow: hidden;
        }

        .ticker-header h2 {
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Scroller Window */
        .scroller-window {
            flex-grow: 1;
            overflow: hidden; /* Hide scrollbars */
            position: relative;
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
        }

        /* The Track that moves */
        .scroller-track {
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: scrollUp 20s linear infinite;
        }
        
        /* Pause on hover */
        .scroller-window:hover .scroller-track {
            animation-play-state: paused;
        }

        /* Testimonial Card */
        .t-card {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 20px;
            color: var(--brand-dark);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
            border-left: 5px solid var(--brand-blue);
        }

        .t-card:hover { transform: scale(1.02); }

        .t-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .t-img {
            width: 50px; height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--brand-blue);
        }

        .t-info h4 { font-size: 1rem; font-weight: 700; margin: 0; }
        
        .t-stars { color: #facc15; font-size: 0.8rem; margin-top: 3px; }

        .t-text {
            font-size: 0.9rem;
            color: #475569;
            line-height: 1.5;
            font-style: italic;
        }

        @keyframes scrollUp {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); } /* Moves up by half its height (assuming duplicated content) */
        }

        @keyframes fadeInLeft { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeInRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }

        /* Responsive */
        @media (max-width: 900px) {
            .main-wrapper { flex-direction: column; height: auto; padding: 50px 0; }
            .form-container, .testimonial-ticker { width: 100%; height: auto; }
            .scroller-window { height: 400px; }
        }
    </style>
</head>
<body>

    <video class="video-bg" autoplay muted loop playsinline>
        <source src="https://player.vimeo.com/external/452134136.sd.mp4?s=7284986687c73631780845570c04804b00f8f723&profile_id=164&oauth2_token_id=57447761" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <div class="main-wrapper">
        
        <div class="form-container">
            <h1>Share Your Story</h1>
            
            <form id="testimonial-form">
                
                <div class="image-upload-group">
                    <img id="image-preview" src="https://via.placeholder.com/100/0f172a/ffffff?text=User" alt="Preview">
                    <div>
                        <input type="file" id="image-upload" accept="image/*">
                        <label for="image-upload" class="file-upload-label"><i class="fas fa-camera"></i> Upload Photo</label>
                        <div style="font-size:0.8rem; color:rgba(255,255,255,0.5); margin-top:5px;">Max size 2MB</div>
                    </div>
                </div>
                
                <div class="form-field">
                    <input type="text" id="user-name" placeholder=" " required>
                    <label for="user-name">Your Name</label>
                </div>

                <div class="star-rating-group">
                    <label>Rate your experience:</label>
                    <div class="star-rating-input">
                        <input type="radio" id="star5" name="rating" value="5" required><label for="star5" title="5 stars"><i class="fas fa-star"></i></label>
                        <input type="radio" id="star4" name="rating" value="4"><label for="star4" title="4 stars"><i class="fas fa-star"></i></label>
                        <input type="radio" id="star3" name="rating" value="3"><label for="star3" title="3 stars"><i class="fas fa-star"></i></label>
                        <input type="radio" id="star2" name="rating" value="2"><label for="star2" title="2 stars"><i class="fas fa-star"></i></label>
                        <input type="radio" id="star1" name="rating" value="1"><label for="star1" title="1 star"><i class="fas fa-star"></i></label>
                    </div>
                </div>

                <div class="form-field">
                    <textarea id="testimonial-text" rows="4" placeholder=" " required></textarea>
                    <label for="testimonial-text">Your Feedback</label>
                </div>
                
                <button type="submit" class="submit-btn">Submit Review</button>
                <p id="message-area"></p>

            </form>
        </div>
        
        <div class="testimonial-ticker">
            <div class="ticker-header">
                <h2><i class="fas fa-quote-left" style="color:var(--brand-cyan); margin-right:10px;"></i> What Patients Say</h2>
            </div>
            <div class="scroller-window">
                <div class="scroller-track" id="scroller-track">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // --- JAVASCRIPT LOGIC ---
        
        // 1. Mock Data (Initial Testimonials)
        const initialTestimonials = [
            { name: "Sarah Jenkins", rating: 5, text: "The video consultation was seamless. Dr. Mehta was incredibly patient and knowledgeable.", img: "https://randomuser.me/api/portraits/women/44.jpg" },
            { name: "Rajesh Kumar", rating: 4, text: "Great experience overall. The platform is very easy to use, even for my elderly parents.", img: "https://randomuser.me/api/portraits/men/32.jpg" },
            { name: "Emily Chen", rating: 5, text: "Saved me a trip to the clinic! The secure connection gave me peace of mind.", img: "https://randomuser.me/api/portraits/women/65.jpg" },
            { name: "Michael Ross", rating: 5, text: "Professional service. Highly recommend Sachidaanand Health for quick checkups.", img: "https://randomuser.me/api/portraits/men/85.jpg" }
        ];

        const track = document.getElementById('scroller-track');

        // 2. Function to Create Card HTML
        function createCard(data) {
            const stars = Array(5).fill('<i class="far fa-star"></i>');
            for(let i=0; i<data.rating; i++) stars[i] = '<i class="fas fa-star"></i>';
            
            return `
                <div class="t-card">
                    <div class="t-header">
                        <img src="${data.img}" class="t-img" alt="${data.name}">
                        <div class="t-info">
                            <h4>${data.name}</h4>
                            <div class="t-stars">${stars.join('')}</div>
                        </div>
                    </div>
                    <div class="t-text">"${data.text}"</div>
                </div>
            `;
        }

        // 3. Render & Animate Ticker
        function renderTicker() {
            // Add initial cards
            let html = initialTestimonials.map(t => createCard(t)).join('');
            
            // Duplicate content to create seamless infinite scroll
            track.innerHTML = html + html; 
        }

        renderTicker();

        // 4. Handle Image Preview
        const imgInput = document.getElementById('image-upload');
        const imgPreview = document.getElementById('image-preview');

        imgInput.addEventListener('change', function() {
            const file = this.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imgPreview.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // 5. Handle Form Submission
        const form = document.getElementById('testimonial-form');
        const msgArea = document.getElementById('message-area');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Gather Data
            const name = document.getElementById('user-name').value;
            const text = document.getElementById('testimonial-text').value;
            const rating = document.querySelector('input[name="rating"]:checked').value;
            const imgSrc = imgPreview.src; // In real app, upload file and get URL

            // Create new object
            const newTestimonial = { name, rating: parseInt(rating), text, img: imgSrc };

            // Add to top of list logically (in a real app, save to DB)
            initialTestimonials.unshift(newTestimonial);
            
            // Re-render ticker to include new item
            renderTicker();

            // Success Feedback
            msgArea.style.color = 'var(--status-green)';
            msgArea.innerHTML = '<i class="fas fa-check-circle"></i> Thank you! Your review has been posted.';
            
            form.reset();
            imgPreview.src = "https://via.placeholder.com/100/0f172a/ffffff?text=User";
            
            setTimeout(() => { msgArea.innerHTML = ''; }, 3000);
        });
    </script>
</body>
</html>
